<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>test — efecto agua en TODO — Gular</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js" } }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    html, body { background: #ffffff; overflow: hidden; }
    #stage {
      position: fixed; inset: 0; z-index: 2; overflow: hidden;
      background: #ffffff url("assets/media/fx/agua-bg.webp") center / cover no-repeat;
    }
    .hero { background: transparent; min-height: 100vh; }
    /* html2canvas no soporta background-clip:text: "agency" como gris sólido */
    .nav__brand .agency, .hero__title .agency {
      background: none !important; -webkit-text-fill-color: #9a9a9a !important; color: #9a9a9a !important;
    }
    .nav__menu { display: none !important; } /* el iso se rasteriza como caja negra */
    .hint { position: fixed; bottom: 1.1rem; left: 50%; transform: translateX(-50%); z-index: 4;
      font-family: var(--font-body); font-size: .72rem; letter-spacing: .18em; text-transform: uppercase;
      color: rgba(0,0,0,.45); pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="space" class="space-canvas" aria-hidden="true"></canvas>

  <div id="stage">
    <header class="nav" id="nav" data-scrolled>
      <a class="nav__brand" href="#hero">gular<span class="agency">agency</span></a>
      <nav class="nav__center" aria-label="Accesos rápidos">
        <a href="#proyectos">clientes.</a>
        <a href="#gular">agency.</a>
        <a href="#contacto" class="accent">trabajemos juntos.</a>
      </nav>
      <button class="nav__menu" aria-label="Menú"><span class="iso"><span class="iso__top"></span><span class="iso__tail"></span></span></button>
    </header>
    <main>
      <section class="hero" id="hero">
        <h1 class="hero__title">gular<span class="agency">agency</span></h1>
        <p class="hero__statement">No hay solución sin <span class="accent">Gular</span></p>
        <p class="hero__lead">
          Y cada proyecto tiene una solución <em>singular</em>. En Gular combinamos sensibilidad
          artística, estrategia comercial y tecnología para encontrarla.
        </p>
        <p class="hero__place">Buenos Aires, Argentina</p>
      </section>
    </main>
  </div>

  <div class="hint">Mové el mouse — se ondula todo</div>
  <script type="module" src="assets/js/space-agua2.js"></script>
</body>
</html>
